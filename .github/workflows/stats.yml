name: Update profile stats
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Stats dark
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: 'username=Fem10da&show_icons=true&include_all_commits=true&hide_rank=true&show=prs_merged,reviews&hide_border=false&border_radius=12&bg_color=161b22&border_color=30363d&title_color=3fb950&icon_color=3fb950&text_color=e6edf3&custom_title=Activity'
          path: stats/stats-dark.svg
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Stats light
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: 'username=Fem10da&show_icons=true&include_all_commits=true&hide_rank=true&show=prs_merged,reviews&hide_border=false&border_radius=12&bg_color=f6f8fa&border_color=d0d7de&title_color=1a7f37&icon_color=1a7f37&text_color=1f2328&custom_title=Activity'
          path: stats/stats-light.svg
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Langs dark
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: 'username=Fem10da&layout=compact&langs_count=10&hide=html,css&border_radius=12&bg_color=161b22&border_color=30363d&title_color=3fb950&text_color=e6edf3&custom_title=Languages'
          path: stats/langs-dark.svg
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Langs light
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: 'username=Fem10da&layout=compact&langs_count=10&hide=html,css&border_radius=12&bg_color=f6f8fa&border_color=d0d7de&title_color=1a7f37&text_color=1f2328&custom_title=Languages'
          path: stats/langs-light.svg
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats/*.svg
          git commit -m "Update profile stats" || exit 0
          git push
